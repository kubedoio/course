events {}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Detect the original client scheme when behind a reverse proxy.
    # If X-Forwarded-Proto is present (e.g. from Traefik, Nginx, Cloudflare)
    # use it; otherwise fall back to the connection scheme.
    map $http_x_forwarded_proto $real_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Connection upgrade map for WebSocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        port_in_redirect off;

        set $lab_app http://lab:8080;
        set $progress_api http://progress-api:8090;
        set $keycloak_app http://keycloak:8080;
        set $oauth2_proxy http://oauth2-proxy:4180;
        set $v86_relay http://v86-relay:80;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        location /auth/ {
            proxy_pass $keycloak_app;
        }

        location /oauth2/ {
            proxy_pass $oauth2_proxy;
        }

        location = /oauth2/auth {
            internal;
            proxy_pass $oauth2_proxy/oauth2/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        location @oauth2_start {
            return 302 /oauth2/start?rd=$real_scheme://$http_host$request_uri;
        }

        location /api/ {
            auth_request /oauth2/auth;
            error_page 401 = @oauth2_start;

            auth_request_set $auth_user $upstream_http_x_auth_request_user;
            auth_request_set $auth_email $upstream_http_x_auth_request_email;
            proxy_set_header X-Forwarded-User $auth_user;
            proxy_set_header X-Forwarded-Email $auth_email;

            proxy_pass $progress_api;
        }

        location /ws/v86/ {
            proxy_pass $v86_relay/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            auth_request /oauth2/auth;
            error_page 401 = @oauth2_start;

            auth_request_set $auth_user $upstream_http_x_auth_request_user;
            auth_request_set $auth_email $upstream_http_x_auth_request_email;
            proxy_set_header X-Forwarded-User $auth_user;
            proxy_set_header X-Forwarded-Email $auth_email;

            proxy_pass $lab_app;
        }
    }
}
