events {}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        port_in_redirect off;

        set $lab_app http://lab:8080;
        set $progress_api http://progress-api:8090;
        set $keycloak_app http://keycloak:8080;
        set $oauth2_proxy http://oauth2-proxy:4180;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        location /auth/ {
            proxy_pass $keycloak_app;
        }

        location /oauth2/ {
            proxy_pass $oauth2_proxy;
        }

        location = /oauth2/auth {
            internal;
            proxy_pass $oauth2_proxy/oauth2/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        location @oauth2_start {
            return 302 /oauth2/start?rd=$scheme://$http_host$request_uri;
        }

        location /api/ {
            auth_request /oauth2/auth;
            error_page 401 = @oauth2_start;

            auth_request_set $auth_user $upstream_http_x_auth_request_user;
            auth_request_set $auth_email $upstream_http_x_auth_request_email;
            proxy_set_header X-Forwarded-User $auth_user;
            proxy_set_header X-Forwarded-Email $auth_email;

            proxy_pass $progress_api;
        }

        location / {
            auth_request /oauth2/auth;
            error_page 401 = @oauth2_start;

            auth_request_set $auth_user $upstream_http_x_auth_request_user;
            auth_request_set $auth_email $upstream_http_x_auth_request_email;
            proxy_set_header X-Forwarded-User $auth_user;
            proxy_set_header X-Forwarded-Email $auth_email;

            proxy_pass $lab_app;
        }
    }
}
